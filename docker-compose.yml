name: rooz-data-cloud

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rooz_data_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-rdc_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "127.0.0.1:${RDC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
      ]
    ports:
      - "127.0.0.1:${RDC_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RDC_S3_ACCESS_KEY:-rdc-local-access}
      MINIO_ROOT_PASSWORD: ${RDC_S3_SECRET_KEY:-change-me-for-local-development}
    ports:
      - "127.0.0.1:${RDC_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${RDC_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/minio/cors.json:/config/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
      $${RDC_S3_ACCESS_KEY:-rdc-local-access}
      $${RDC_S3_SECRET_KEY:-change-me-for-local-development} &&
      mc mb --ignore-existing local/$${RDC_S3_BUCKET:-rdc-local} &&
      mc cors set local/$${RDC_S3_BUCKET:-rdc-local} /config/cors.json
      "
    environment:
      RDC_S3_BUCKET: ${RDC_S3_BUCKET:-rdc-local}
      RDC_S3_ACCESS_KEY: ${RDC_S3_ACCESS_KEY:-rdc-local-access}
      RDC_S3_SECRET_KEY: ${RDC_S3_SECRET_KEY:-change-me-for-local-development}
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      RDC_ENV: ${RDC_ENV:-development}
      RDC_DATABASE_URL: ${RDC_DATABASE_URL:-postgresql+asyncpg://rdc_app:change-me-for-local-development@postgres:5432/rooz_data_cloud}
      RDC_REDIS_URL: ${RDC_REDIS_URL:-redis://redis:6379/0}
      RDC_S3_ENDPOINT: ${RDC_S3_ENDPOINT:-http://minio:9000}
      RDC_S3_PUBLIC_ENDPOINT: ${RDC_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      RDC_S3_REGION: ${RDC_S3_REGION:-us-east-1}
      RDC_S3_BUCKET: ${RDC_S3_BUCKET:-rdc-local}
      RDC_S3_ACCESS_KEY: ${RDC_S3_ACCESS_KEY:-rdc-local-access}
      RDC_S3_SECRET_KEY: ${RDC_S3_SECRET_KEY:-change-me-for-local-development}
      RDC_STORAGE_UPLOAD_GRANT_SECONDS: ${RDC_STORAGE_UPLOAD_GRANT_SECONDS:-900}
      RDC_STORAGE_DOWNLOAD_GRANT_SECONDS: ${RDC_STORAGE_DOWNLOAD_GRANT_SECONDS:-300}
      RDC_SOURCE_ARCHIVE_MAX_BYTES: ${RDC_SOURCE_ARCHIVE_MAX_BYTES:-33554432}
      RDC_SOURCE_ARCHIVE_MAX_EXPANDED_BYTES: ${RDC_SOURCE_ARCHIVE_MAX_EXPANDED_BYTES:-268435456}
      RDC_SOURCE_ARCHIVE_MAX_FILES: ${RDC_SOURCE_ARCHIVE_MAX_FILES:-10000}
      RDC_SOURCE_ARCHIVE_MAX_SINGLE_FILE_BYTES: ${RDC_SOURCE_ARCHIVE_MAX_SINGLE_FILE_BYTES:-67108864}
      RDC_SOURCE_ARCHIVE_MAX_COMPRESSION_RATIO: ${RDC_SOURCE_ARCHIVE_MAX_COMPRESSION_RATIO:-100}
      RDC_ALLOWED_ORIGINS: '${RDC_ALLOWED_ORIGINS:-["http://localhost:3000"]}'
      RDC_SESSION_COOKIE_NAME: ${RDC_SESSION_COOKIE_NAME:-rdc_session}
      RDC_SESSION_COOKIE_SECURE: ${RDC_SESSION_COOKIE_SECURE:-false}
      RDC_SESSION_TOKEN_PEPPER: ${RDC_SESSION_TOKEN_PEPPER:-change-me-session-token-pepper-at-least-32-characters}
      RDC_CSRF_TOKEN_PEPPER: ${RDC_CSRF_TOKEN_PEPPER:-change-me-csrf-token-pepper-at-least-32-characters}
      RDC_API_KEY_PEPPER: ${RDC_API_KEY_PEPPER:-change-me-api-key-pepper-at-least-32-characters}
      RDC_API_KEY_ISSUANCE_SECRET: ${RDC_API_KEY_ISSUANCE_SECRET:-change-me-api-key-issuance-secret-at-least-32-characters}
      RDC_RATE_LIMIT_KEY: ${RDC_RATE_LIMIT_KEY:-change-me-rate-limit-key-at-least-32-characters}
      RDC_CURSOR_SIGNING_KEY: ${RDC_CURSOR_SIGNING_KEY:-change-me-cursor-signing-key-at-least-32-characters}
      RDC_PROJECT_SECRET_MASTER_KEY_B64: ${RDC_PROJECT_SECRET_MASTER_KEY_B64:-ZGV2ZWxvcG1lbnQtcmRjLXNlY3JldC1rZXktMzJiISE=}
      RDC_PROJECT_SECRET_MASTER_KEY_VERSION: ${RDC_PROJECT_SECRET_MASTER_KEY_VERSION:-local-v1}
      RDC_WORKER_BOOTSTRAP_TOKEN: ${RDC_WORKER_BOOTSTRAP_TOKEN:-change-me-worker-bootstrap-token-at-least-32-characters}
      RDC_WORKER_TOKEN_PEPPER: ${RDC_WORKER_TOKEN_PEPPER:-change-me-worker-token-pepper-at-least-32-characters}
      RDC_LEASE_TOKEN_PEPPER: ${RDC_LEASE_TOKEN_PEPPER:-change-me-lease-token-pepper-at-least-32-characters}
      RDC_WORKER_LEASE_SECONDS: ${RDC_WORKER_LEASE_SECONDS:-60}
      RDC_WORKER_LEASE_MAX_SECONDS: ${RDC_WORKER_LEASE_MAX_SECONDS:-300}
      RDC_WORKER_MAX_ATTEMPTS: ${RDC_WORKER_MAX_ATTEMPTS:-5}
      RDC_WORKER_RETRY_BASE_SECONDS: ${RDC_WORKER_RETRY_BASE_SECONDS:-2}
      RDC_WORKER_RETRY_MAX_SECONDS: ${RDC_WORKER_RETRY_MAX_SECONDS:-300}
      RDC_WORKER_CANCEL_CONVERGENCE_SECONDS: ${RDC_WORKER_CANCEL_CONVERGENCE_SECONDS:-300}
      RDC_WORKER_SECRET_ENVELOPE_SECONDS: ${RDC_WORKER_SECRET_ENVELOPE_SECONDS:-60}
      RDC_SANDBOX_EXECUTION_ENABLED: ${RDC_SANDBOX_EXECUTION_ENABLED:-false}
      RDC_SANDBOX_REQUIRED_PROFILE: ${RDC_SANDBOX_REQUIRED_PROFILE:-rdc.sandbox/v1}
      RDC_SANDBOX_MAX_MEMORY_MB: ${RDC_SANDBOX_MAX_MEMORY_MB:-4096}
      RDC_SANDBOX_MAX_CPU_MILLIS: ${RDC_SANDBOX_MAX_CPU_MILLIS:-4000}
      RDC_SANDBOX_MAX_PIDS: ${RDC_SANDBOX_MAX_PIDS:-512}
      RDC_SANDBOX_MAX_EPHEMERAL_DISK_MB: ${RDC_SANDBOX_MAX_EPHEMERAL_DISK_MB:-8192}
      RDC_SANDBOX_MAX_BUILD_SECONDS: ${RDC_SANDBOX_MAX_BUILD_SECONDS:-900}
      RDC_SANDBOX_MAX_RUN_SECONDS: ${RDC_SANDBOX_MAX_RUN_SECONDS:-600}
      RDC_SANDBOX_MAX_OUTPUT_BYTES: ${RDC_SANDBOX_MAX_OUTPUT_BYTES:-16777216}
      RDC_SANDBOX_ARTIFACT_MAX_BYTES: ${RDC_SANDBOX_ARTIFACT_MAX_BYTES:-8589934592}
      RDC_SANDBOX_ACTIVATION_MODE: ${RDC_SANDBOX_ACTIVATION_MODE:-disabled}
      RDC_SANDBOX_CANARY_AGENT_VERSION_ID: ${RDC_SANDBOX_CANARY_AGENT_VERSION_ID:-}
      RDC_SANDBOX_CANARY_WORKER_NAME: ${RDC_SANDBOX_CANARY_WORKER_NAME:-}
      RDC_SANDBOX_CANARY_MAX_MEMORY_MB: ${RDC_SANDBOX_CANARY_MAX_MEMORY_MB:-256}
      RDC_SANDBOX_CANARY_MAX_CPU_MILLIS: ${RDC_SANDBOX_CANARY_MAX_CPU_MILLIS:-500}
      RDC_SANDBOX_CANARY_MAX_PIDS: ${RDC_SANDBOX_CANARY_MAX_PIDS:-64}
      RDC_SANDBOX_CANARY_MAX_EPHEMERAL_DISK_MB: ${RDC_SANDBOX_CANARY_MAX_EPHEMERAL_DISK_MB:-256}
      RDC_SANDBOX_CANARY_MAX_BUILD_SECONDS: ${RDC_SANDBOX_CANARY_MAX_BUILD_SECONDS:-300}
      RDC_SANDBOX_CANARY_MAX_RUN_SECONDS: ${RDC_SANDBOX_CANARY_MAX_RUN_SECONDS:-120}
      RDC_SANDBOX_CANARY_WEB_EGRESS_ENABLED: ${RDC_SANDBOX_CANARY_WEB_EGRESS_ENABLED:-false}
      RDC_SANDBOX_CANARY_WEB_EGRESS_ALLOWED_HOSTS: '${RDC_SANDBOX_CANARY_WEB_EGRESS_ALLOWED_HOSTS:-[]}'
      RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_REQUESTS: ${RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_REQUESTS:-8}
      RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_RESPONSE_BYTES: ${RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_RESPONSE_BYTES:-1048576}
      RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_TOTAL_BYTES: ${RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_TOTAL_BYTES:-4194304}
      RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_REDIRECTS: ${RDC_SANDBOX_CANARY_WEB_EGRESS_MAX_REDIRECTS:-3}
      RDC_SANDBOX_CANARY_WEB_EGRESS_CONNECT_TIMEOUT_SECONDS: ${RDC_SANDBOX_CANARY_WEB_EGRESS_CONNECT_TIMEOUT_SECONDS:-5}
      RDC_SANDBOX_CANARY_WEB_EGRESS_REQUEST_TIMEOUT_SECONDS: ${RDC_SANDBOX_CANARY_WEB_EGRESS_REQUEST_TIMEOUT_SECONDS:-15}
      RDC_SANDBOX_CANARY_BROWSER_ENABLED: ${RDC_SANDBOX_CANARY_BROWSER_ENABLED:-false}
      RDC_SANDBOX_CANARY_BROWSER_LIVE_NAVIGATION_ENABLED: ${RDC_SANDBOX_CANARY_BROWSER_LIVE_NAVIGATION_ENABLED:-false}
      RDC_SANDBOX_CANARY_DATASET_WRITES_ENABLED: ${RDC_SANDBOX_CANARY_DATASET_WRITES_ENABLED:-false}
      RDC_SANDBOX_CANARY_KEY_VALUE_STORE_ENABLED: ${RDC_SANDBOX_CANARY_KEY_VALUE_STORE_ENABLED:-false}
      RDC_SANDBOX_CANARY_BROWSER_MAX_PAGES: ${RDC_SANDBOX_CANARY_BROWSER_MAX_PAGES:-1}
      RDC_SANDBOX_CANARY_BROWSER_MAX_ACTIONS: ${RDC_SANDBOX_CANARY_BROWSER_MAX_ACTIONS:-8}
      RDC_SANDBOX_CANARY_BROWSER_NAVIGATION_TIMEOUT_SECONDS: ${RDC_SANDBOX_CANARY_BROWSER_NAVIGATION_TIMEOUT_SECONDS:-15}
      RDC_SANDBOX_CANARY_BROWSER_MAX_DOM_BYTES: ${RDC_SANDBOX_CANARY_BROWSER_MAX_DOM_BYTES:-2097152}
      RDC_SANDBOX_CANARY_BROWSER_MAX_SCREENSHOT_BYTES: ${RDC_SANDBOX_CANARY_BROWSER_MAX_SCREENSHOT_BYTES:-2097152}
      RDC_RUN_SSE_POLL_INTERVAL_SECONDS: ${RDC_RUN_SSE_POLL_INTERVAL_SECONDS:-1.0}
      RDC_RUN_SSE_HEARTBEAT_SECONDS: ${RDC_RUN_SSE_HEARTBEAT_SECONDS:-15.0}
      RDC_RUN_SSE_MAX_CONNECTIONS: ${RDC_RUN_SSE_MAX_CONNECTIONS:-100}
      RDC_RUN_SSE_REPLAY_LIMIT: ${RDC_RUN_SSE_REPLAY_LIMIT:-500}
    ports:
      - "127.0.0.1:${RDC_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped

  console:
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    environment:
      NEXT_PUBLIC_RDC_API_BASE_URL: ${NEXT_PUBLIC_RDC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${RDC_CONSOLE_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
