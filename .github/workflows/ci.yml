name: RDC CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rdc-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: rooz_data_cloud
          POSTGRES_USER: rdc_app
          POSTGRES_PASSWORD: rdc_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rdc_app -d rooz_data_cloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      RDC_ENV: test
      RDC_DATABASE_URL: postgresql+asyncpg://rdc_app:rdc_ci_password@127.0.0.1:5432/rooz_data_cloud
      RDC_REDIS_URL: redis://127.0.0.1:6379/0
      RDC_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      RDC_SESSION_COOKIE_SECURE: "false"
      RDC_SESSION_TOKEN_PEPPER: ci-session-token-pepper-with-more-than-thirty-two-characters
      RDC_CSRF_TOKEN_PEPPER: ci-csrf-token-pepper-with-more-than-thirty-two-characters
      RDC_API_KEY_PEPPER: ci-api-key-pepper-with-more-than-thirty-two-characters
      RDC_API_KEY_ISSUANCE_SECRET: ci-api-key-issuance-secret-with-more-than-thirty-two-characters
      RDC_RATE_LIMIT_KEY: ci-rate-limit-key-with-more-than-thirty-two-characters
      RDC_CURSOR_SIGNING_KEY: ci-cursor-signing-key-with-more-than-thirty-two-characters
      RDC_PROJECT_SECRET_MASTER_KEY_B64: ZGV2ZWxvcG1lbnQtcmRjLXNlY3JldC1rZXktMzJiISE=
      RDC_PROJECT_SECRET_MASTER_KEY_VERSION: ci-v1
      RDC_WORKER_BOOTSTRAP_TOKEN: ci-worker-bootstrap-token-with-more-than-thirty-two-characters
      RDC_WORKER_TOKEN_PEPPER: ci-worker-token-pepper-with-more-than-thirty-two-characters
      RDC_LEASE_TOKEN_PEPPER: ci-lease-token-pepper-with-more-than-thirty-two-characters
      RDC_WORKER_LEASE_SECONDS: "60"
      RDC_WORKER_LEASE_MAX_SECONDS: "300"
      RDC_WORKER_MAX_ATTEMPTS: "5"
      RDC_WORKER_SECRET_ENVELOPE_SECONDS: "60"
      RDC_SANDBOX_EXECUTION_ENABLED: "false"
      RDC_SANDBOX_REQUIRED_PROFILE: rdc.sandbox/v1
      RDC_SANDBOX_ACTIVATION_MODE: disabled
      RDC_SANDBOX_CANARY_AGENT_VERSION_ID: ""
      RDC_SANDBOX_CANARY_WORKER_NAME: ""
      RDC_SANDBOX_CANARY_WEB_EGRESS_ENABLED: "false"
      RDC_SANDBOX_CANARY_WEB_EGRESS_ALLOWED_HOSTS: "[]"
      RDC_SANDBOX_CANARY_BROWSER_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  scaffold:
    name: Scaffold and Compose checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/verify-scaffold.py
      - run: python3 scripts/verify-phase1b.py
      - run: python3 scripts/verify-phase1c.py
      - run: python3 scripts/verify-phase1d.py
      - run: python3 scripts/verify-phase1e.py
      - run: python3 scripts/verify-phase1f.py
      - run: python3 scripts/verify-phase1g.py
      - run: python3 scripts/verify-phase1h.py
      - run: python3 scripts/verify-phase1i.py
      - run: python3 scripts/verify-phase1j.py
      - run: python3 scripts/verify-phase1k.py
      - run: python3 scripts/verify-phase1l.py
      - run: python3 scripts/verify-phase1m.py
      - run: python3 scripts/verify-phase1n.py
      - run: python3 scripts/verify-phase1o.py
      - run: python3 scripts/verify-phase1p.py
      - run: docker compose config --quiet
